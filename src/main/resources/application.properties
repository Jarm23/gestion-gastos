spring.application.name=gestion-gastos

server.servlet.session.cookie.same-site=lax
# La cookie de sesion solo viaja por HTTPS y no es accesible desde JavaScript
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# HTTPS (certificado local en certs/, generado con openssl y fuera de git)
server.port=8443
server.ssl.enabled=true
server.ssl.certificate=file:certs/localhost.pem
server.ssl.certificate-private-key=file:certs/localhost-key.pem

# Datasource MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/gastosdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
